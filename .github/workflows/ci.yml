name: CI

on:
  push:
    branches: [main, V2]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependensi
        run: flutter pub get

      - name: Analisis
        run: flutter analyze

      - name: Tes
        run: flutter test
