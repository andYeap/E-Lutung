name: CI

on:
  push:
    branches: [main, V2, V3]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Berjalan sebelum pub get, dan menangkap teks rusak lebih awal
      # daripada menunggu analyze dan test selesai. Override working-directory
      # karena default job adalah app/, sedangkan skrip ada di root repo.
      - name: Karakter huruf asing
        working-directory: .
        run: ./tool/check-charset.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependensi
        run: flutter pub get

      - name: Analisis
        run: flutter analyze

      - name: Tes
        run: flutter test
