<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Latar kuning lembut Krem; lapisan belakang ikon adaptif. -->
  <rect width="512" height="512" fill="#F2CE6B"/>

  <!-- Koin: dua lingkaran, tepi tebal dan cincin dalam. -->
  <circle cx="256" cy="268" r="146" fill="#F6F5F1" stroke="#23211C" stroke-width="22"/>
  <circle cx="256" cy="268" r="116" fill="none" stroke="#23211C" stroke-width="7" opacity="0.45"/>

  <!-- Jambul lutung menembus tepi atas koin, jadi koinnya sekaligus berkepala. -->
  <path d="M256 74c30 0 52 22 52 50 0 16-8 30-20 38h-64c-12-8-20-22-20-38 0-28 22-50 52-50z"
        fill="#23211C"/>

  <!-- Muka lutung: bulu gelap, moncong terang, mata terang. -->
