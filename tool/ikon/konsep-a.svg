  <circle cx="222" cy="252" r="21" fill="#F6F5F1"/>
  <circle cx="290" cy="252" r="21" fill="#F6F5F1"/>
  <circle cx="222" cy="252" r="9" fill="#23211C"/>
  <circle cx="290" cy="252" r="9" fill="#23211C"/>
  <ellipse cx="256" cy="296" rx="15" ry="10" fill="#23211C"/>
  <path d="M238 322q18 16 36 0" fill="none" stroke="#23211C" stroke-width="9"
        stroke-linecap="round"/>
  <path d="M186 268q-34 4-38 30" fill="none" stroke="#23211C" stroke-width="12"
